name: Build and test Jamb multiplayer
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run scoring + five-player integration tests
        run: bash scripts/test.sh
      - name: Upload runnable Java game
        uses: actions/upload-artifact@v4
        with:
          name: Jamb-Multiplayer-JAR
          path: dist/Jamb-Multiplayer.jar
          if-no-files-found: error
